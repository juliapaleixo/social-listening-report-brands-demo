<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório de exemplo · Cliente Exemplo</title>
<style>
:root{
  --bg:#ffffff; --panel:#faf9f6; --panel2:#f3f1ea; --ink:#1c1b19; --muted:#71706b;
  --line:#e7e4dd; --line2:#d9d5cc;
  --gold:#a9791f; --gold-2:#c79a3c; --gold-soft:#f6eed9;
  --mc:#6b3fa0; --mc-soft:#ece3f5;
  --pos:#2e8b57; --neu:#eab308; --neg:#d14b45;
  --pos-soft:#e3f1e9; --neg-soft:#fbe6e5;
  --up:#2e8b57; --down:#d14b45;
  --shadow:0 1px 2px rgba(20,18,14,.04),0 6px 20px rgba(20,18,14,.05);
  --radius:16px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
/* per-brand accent palette, derived from each brand's logo (overrides --gold/-2/-soft only; --mc is the universal "concorrente" purple, kept distinct from every brand's own color) */
body[data-brand="m2"]{--gold:#d81f34; --gold-2:#e8636e; --gold-soft:#fbe7e9;}
body[data-brand="m3"]{--gold:#0f6b4c; --gold-2:#3d9973; --gold-soft:#e3f0ea;}
body[data-brand="m4"]{--gold:#8c1f24; --gold-2:#b8565b; --gold-soft:#f2e2e2;}
body[data-brand="m5"]{--gold:#ad9223; --gold-2:#cab144; --gold-soft:#faf3d6;}
body[data-brand="m6"]{--gold:#1a8296; --gold-2:#5cb5c4; --gold-soft:#e2f2f4;}
body[data-brand="m7"]{--gold:#b5651d; --gold-2:#d99a5b; --gold-soft:#f7ead9;}
.drink img{transition:max-width .15s,max-height .15s}
body[data-brand="m2"] .drink img{max-width:160px;max-height:63vh}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{line-height:1.5;font-size:15px}
a{color:inherit}
img{max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* ===== Header ===== */
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 24px;max-width:1160px;margin:0 auto}
.brand-lockup{display:flex;align-items:center;gap:16px}
.brand-lockup img{height:34px;width:auto;object-fit:contain}
.brand-lockup .divider{width:1px;height:30px;background:var(--line2)}
.title-block{display:flex;flex-direction:column;line-height:1.15}
.title-block .t1{font-weight:700;font-size:16px;letter-spacing:.02em}
.title-block .t2{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.period-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--gold);background:var(--gold-soft);border:1px solid #ecdcb4;padding:6px 14px;border-radius:999px;font-weight:600;white-space:nowrap}

/* ===== Tabs ===== */
nav.tabs{position:sticky;top:63px;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.tabs-inner{display:flex;gap:2px;max-width:none;margin:0 auto;padding:0 14px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;justify-content:center}
.tabs-inner::-webkit-scrollbar{display:none;height:0}

.header-right{display:flex;align-items:center;gap:16px}
/* period selector */
.period-select{position:relative;flex:0 0 auto}
.period-btn{display:flex;align-items:center;gap:10px;background:var(--gold-soft);border:1px solid #ecdcb4;border-radius:999px;padding:7px 14px;cursor:pointer;font-family:var(--font)}
.period-btn:hover{border-color:var(--gold)}
.pl-cal{font-size:14px;line-height:1}
.pl-text{display:flex;flex-direction:column;line-height:1.12;text-align:left}
.pl-tipo{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pl-label{font-size:13.5px;font-weight:700;color:var(--ink)}
.pl-caret{color:var(--gold);font-size:11px}
.period-menu{position:absolute;top:calc(100% + 8px);right:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.16);padding:8px;min-width:236px;display:none;z-index:60}
.period-menu.open{display:block}
.pm-group{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b9b4a8;padding:8px 10px 4px}
.pm-subgroup{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--ink)}
.pm-subgroup:hover{background:var(--panel2)}
.pm-sub-caret{color:var(--gold);font-size:10px;transition:transform .15s}
.pm-subgroup.open .pm-sub-caret{transform:rotate(180deg)}
.pm-sublist{display:none;padding-left:12px}
.pm-sublist.open{display:block}
.pm-item{display:flex;flex-direction:column;width:100%;text-align:left;background:none;border:none;border-radius:9px;padding:9px 10px;cursor:pointer;font-family:var(--font);font-size:13.5px;font-weight:700;color:var(--ink)}
.pm-item:hover{background:var(--panel2)}
.pm-item.active{background:var(--gold-soft)}
.pm-range{font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
@media(max-width:760px){.pl-text{display:none}}
/* balão de aviso do seletor de período */
.period-hint{position:absolute;top:calc(100% + 12px);right:0;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:11px 16px;padding-right:32px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.22);max-width:216px;line-height:1.45;z-index:59;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .25s,transform .25s}
.period-hint.show{opacity:1;transform:none;pointer-events:auto}
.period-hint:before{content:'';position:absolute;top:-6px;right:24px;width:12px;height:12px;background:var(--ink);transform:rotate(45deg)}
.period-hint .ph-close{position:absolute;top:6px;right:8px;background:none;border:none;color:#fff;opacity:.65;font-size:16px;line-height:1;cursor:pointer;padding:3px 5px}
.period-hint .ph-close:hover{opacity:1}

.tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:11px 14px;border:none;background:none;cursor:pointer;color:var(--muted);font-family:var(--font);font-size:14.5px;font-weight:600;border-bottom:2.5px solid transparent;transition:.15s;white-space:nowrap}
.tab img{height:22px;width:22px;object-fit:contain;border-radius:5px;filter:grayscale(1);opacity:.55;transition:.15s}
.tab:hover{color:var(--ink)}
.tab:hover img{opacity:.85;filter:grayscale(.2)}
.tab.active{color:var(--ink);border-bottom-color:var(--gold)}
.tab.active img{filter:none;opacity:1}
.tab .soon{font-size:8.5px;font-weight:700;color:#b08b3c;background:var(--gold-soft);padding:1px 5px;border-radius:5px;letter-spacing:.02em}

/* ===== Sections ===== */
main{padding:28px 0 90px}
.layout{position:relative}
.content-area{margin:0 auto;max-width:1160px;padding:0 24px}
.side{display:none;position:fixed;left:0;top:116px;width:218px;max-height:calc(100vh - 136px);overflow:auto;scrollbar-width:thin;padding:0 12px 24px 20px}
.side::-webkit-scrollbar{width:6px}
.drink{position:fixed;right:22px;top:56%;transform:translateY(-50%);z-index:5;pointer-events:none;display:none}
.drink img{width:auto;max-width:184px;max-height:72vh;display:block;filter:drop-shadow(0 14px 30px rgba(0,0,0,.22))}
.pie-row{display:flex;align-items:center;gap:16px;flex-wrap:nowrap}
.pie-row .legend{min-width:0;flex:1}
@media(max-width:560px){.pie-row{flex-wrap:wrap}}
.side-title{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b9b4a8;padding:0 12px;margin:2px 0 10px}
.side-link{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;border-left:2.5px solid transparent;margin-bottom:2px;transition:.12s;cursor:pointer;white-space:nowrap}
.side-link .n{font-size:11px;font-weight:800;width:20px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--panel2);color:var(--muted)}
.side-link:hover{color:var(--ink);background:var(--panel)}
.side-link.active{color:var(--gold);background:var(--gold-soft);border-left-color:var(--gold)}
.side-link.active .n{background:var(--gold);color:#fff}
section.block{scroll-margin-top:120px}
@media(min-width:1041px)and(max-width:1199px){.side{display:block}.content-area{margin-left:242px;margin-right:24px;max-width:1120px;padding:0}}
@media(min-width:1200px){.side{display:block}.layout{padding:0 230px}.content-area{margin:0 auto;max-width:1040px;padding:0}.drink.has{display:block}}
/* Visão Geral não usa o menu lateral nem a foto do produto -- centraliza o conteúdo
   ocupando a largura toda, em vez de reservar as margens laterais dos outros dois */
body[data-brand="overview"] .side{display:none!important}
@media(min-width:1041px){
  body[data-brand="overview"] .layout{padding:0}
  body[data-brand="overview"] .content-area{margin:0 auto;max-width:1160px;padding:0 24px}
}
.brand-hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:10px 0 14px;text-align:center;min-height:90px}
.brand-hero img{height:98px;width:auto;object-fit:contain}
.brand-hero .period-corner{position:absolute;top:2px;right:0;color:var(--muted);font-size:12.5px;background:var(--panel);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-weight:600}
@media(max-width:560px){.brand-hero .period-corner{position:static;margin-bottom:6px}}
section.block{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-head .num{font-size:12px;font-weight:800;color:var(--gold);background:var(--gold-soft);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;align-self:center}
.sec-head h2{font-size:19px;margin:0;letter-spacing:-.01em}
.sec-head .hint{margin-left:auto;font-size:12px;color:var(--muted)}

.grid{display:grid;gap:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-2{grid-template-columns:repeat(2,1fr)}
.grid-conc{display:grid;gap:16px;grid-template-columns:minmax(320px,1fr) minmax(360px,1.3fr)}
@media(max-width:900px){.g-4{grid-template-columns:repeat(2,1fr)}.g-3,.g-2{grid-template-columns:1fr}.grid-conc{grid-template-columns:1fr}}
@media(max-width:560px){.g-4{grid-template-columns:1fr}}
/* grade da Visão Geral: sempre 4 por linha, última linha incompleta fica centralizada
   (grid comum deixaria um buraco à direita quando sobram 3 de 7 marcas) */
.ov-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.ov-grid>*{flex:0 0 calc((100% - 54px)/4)}
@media(max-width:900px){.ov-grid>*{flex:0 0 calc((100% - 18px)/2)}}
@media(max-width:560px){.ov-grid>*{flex:0 0 100%}}

/* Visão Geral -- destaques/pontos de atenção automáticos */
.ov-insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 8px}
@media(max-width:800px){.ov-insight-grid{grid-template-columns:1fr}}
.ov-insight-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow)}
.ov-insight-card h3{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;margin:0 0 14px;color:var(--gold)}
.ov-insight-card.attn h3{color:var(--neg)}
.ov-insight-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px}
.ov-insight-card li{font-size:13px;line-height:1.55;color:var(--muted);padding-left:15px;position:relative}
.ov-insight-card li:before{content:'';position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.45}
.ov-insight-card b{color:var(--ink);font-weight:800}
/* Visão Geral -- gráfico de barras verticais (Volume total) */
.ov-barchart{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:22px;height:340px;padding:30px 14px 0;overflow-x:auto}
.ov-barchart:before{content:'';position:absolute;left:14px;right:14px;bottom:44px;border-top:1.5px solid var(--line2)}
.ov-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:0 0 auto;height:100%;min-width:60px}
.ov-bar-val{font-size:14px;font-weight:800;margin-bottom:8px;white-space:nowrap}
.ov-bar-rect{width:52px;border-radius:9px 9px 0 0;position:relative;z-index:1}
.ov-bar-logo{margin-top:14px;height:30px;max-width:86px;object-fit:contain;position:relative;z-index:1}
/* Visão Geral -- cards "Nós vs. concorrente" com duas barras empilhadas */
.ov-vs-card{position:relative;text-align:left;padding:18px 18px 20px!important}
.ov-vs-badge{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;color:#fff}
.ov-vs-top{position:absolute;top:-9px;left:-9px;width:24px;height:24px;border-radius:50%;color:#fff;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.28);border:2px solid #fff;z-index:2}
.ov-vs-logo{height:30px;max-width:150px;object-fit:contain;margin-bottom:14px;display:block}
.ov-vs-nums{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:10px}
.ov-vs-nums b{display:block;font-size:19px;color:var(--ink);margin-top:3px;font-weight:800}
.ov-vs-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.ov-vs-row:first-of-type{margin-top:0}
.ov-vs-row .lbl{font-size:10px;font-weight:700;color:var(--muted);width:62px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-vs-track{flex:1;height:9px;background:var(--panel2);border-radius:999px;overflow:hidden}
.ov-vs-fill{height:100%;border-radius:999px}
/* Visão Geral -- listas ranqueadas (Saudabilidade / Meta mensal) */
.ov-rank-list{display:flex;flex-direction:column;gap:10px}
.ov-rank-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 15px}
.ov-rank-num{width:22px;height:22px;border-radius:50%;background:var(--panel2);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ov-rank-row:nth-child(1) .ov-rank-num{background:#d4af37;color:#fff}
.ov-rank-row:nth-child(2) .ov-rank-num{background:#b8b8b8;color:#fff}
.ov-rank-row:nth-child(3) .ov-rank-num{background:#c98a4b;color:#fff}
.ov-rank-logo{height:24px;max-width:104px;object-fit:contain;flex:0 0 auto}
.ov-rank-track{flex:1;height:10px;background:var(--panel2);border-radius:999px;overflow:hidden}
.ov-rank-fill{height:100%;border-radius:999px}
.ov-rank-val{font-size:13.5px;font-weight:800;width:58px;text-align:right;flex:0 0 auto}
/* simbolo de atencao (!) com aviso no hover */
.warn-i{position:relative;display:inline-block;margin-left:8px;font-size:16px;font-weight:400;line-height:1;cursor:help;vertical-align:middle;text-transform:none;letter-spacing:0}
.warn-pop{display:none;position:absolute;left:-8px;top:calc(100% + 8px);width:300px;max-width:78vw;padding:11px 13px;border-radius:12px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;line-height:1.5;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:70;white-space:normal}
.warn-i:hover .warn-pop,.warn-i:focus .warn-pop{display:block}
/* Visão Geral -- Saudabilidade e Meta mensal lado a lado */
.ov-side-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.ov-side-grid section.block{margin-top:44px}
/* a legenda da seção 3 é mais longa que a da seção 4 e espremia só o título dela pra
   2 linhas mesmo com colunas iguais -- aqui a legenda sempre quebra pra uma linha
   própria abaixo do título, então o título nunca quebra em nenhuma das duas colunas */
.ov-side-grid .sec-head{flex-wrap:wrap;row-gap:4px}
.ov-side-grid .sec-head h2{white-space:nowrap}
.ov-side-grid .sec-head .hint{flex-basis:100%;margin-left:38px}
@media(max-width:900px){.ov-side-grid{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.plain{background:#fff}
.kpi .label{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.kpi .value{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .value.sm{font-size:26px}
.kpi .foot{margin-top:10px;font-size:13px;color:var(--muted)}
.var{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;padding:3px 9px;border-radius:999px}
.var.up{color:var(--up);background:var(--pos-soft)}
.var.down{color:var(--down);background:var(--neg-soft)}
.var .arw{font-size:11px}

.kpi-accent{background:linear-gradient(160deg,#fff,var(--gold-soft));border-color:#ecdcb4}

/* health card w/ donut */
.health{display:flex;align-items:center;gap:16px;cursor:default}
.health .ring{flex:0 0 auto;position:relative}
.health .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.health .ring .ctr b{font-size:20px;font-weight:800}
.health .meta .label{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.health .meta .big{font-size:22px;font-weight:800;margin-top:2px}
.health .meta .mini{font-size:12px;color:var(--muted);margin-top:6px}

/* chart panels */
.chart-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.chart-title{font-size:14px;font-weight:700;margin:0 0 2px}
.chart-sub{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:12px 18px;margin-top:14px;font-size:13px}
.legend .li{display:flex;align-items:center;gap:7px;color:var(--ink)}
.legend .dot{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

/* horizontal bar list */
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar .row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.hbar .row .nm{font-weight:600}
.hbar .row .vl{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:400}
.hbar .row .vl b{color:var(--ink);font-weight:700}
.hbar .track{height:9px;background:var(--panel2);border-radius:999px;overflow:hidden}
.hbar .fill{height:100%;border-radius:999px;background:var(--gold)}

/* ranked list top3 */
.rank{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:none}
.rank .pos{font-size:15px;font-weight:800;color:#fff;background:var(--gold);width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.rank .pos.two{background:var(--gold-2)}
.rank .pos.three{background:#cdb277}
.rank .nm{font-weight:600}
.rank .vl{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.rank .pct{color:var(--muted);font-weight:600;font-size:12px;margin-left:8px}

/* competitor highlight */
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch}
.vs .vs-mid{font-weight:800;color:var(--muted);font-size:13px;text-align:center;align-self:center}
@media(max-width:620px){.vs{grid-template-columns:1fr}}
.vs-card{border-radius:14px;padding:18px;border:1px solid var(--line)}
.vs-card.us{background:var(--gold-soft);border-color:#ecdcb4}
.vs-card.them{background:var(--mc-soft);border-color:#d9c9ec}
.vs-card .who{font-weight:800;font-size:17px;margin-bottom:12px;display:flex;flex-direction:column;align-items:flex-start;gap:7px}
.vs-card .who .tag{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em}
.vs-card.us .tag{background:var(--gold);color:#fff}
.vs-card.them .tag{background:var(--mc);color:#fff}
.vs-card .metric{display:flex;justify-content:space-between;align-items:baseline;padding:6px 0}
.vs-card .metric .m-l{font-size:13px;color:var(--muted)}
.vs-card .metric .m-v{font-size:22px;font-weight:800}

/* editable text boxes */

const __TAIL_SUFFIX__ = "<\/script>\n<\/body>\n<\/html>\n";
const __ORIG_SCRIPT__ = document.currentScript.textContent;
const INTERNAL_ACCESS_PASS = 'demo123'; /* senha do "Acesso interno" -- diferente da senha de visualização */
let unlocked = false; /* true depois que alguém digita a senha de acesso interno corretamente, nesta sessão do navegador */
function toggleInternalAccess(){
  if(unlocked){
    unlocked=false;
    buildFabMenu();
    renderBrand(BRANDS.find(b=>b.id===activeBrand));
    return;
  }
  const pass=prompt('Senha de acesso interno:');
  if(pass===null) return;
  if(pass===INTERNAL_ACCESS_PASS){
    unlocked=true;
    buildFabMenu();
    renderBrand(BRANDS.find(b=>b.id===activeBrand));
  } else {
    alert('Senha incorreta.');
  }
}

/* ============ UPLOAD DE FOTOS DIRETO NO NAVEGADOR ============ */
const UPLOAD_DB_NAME='cliente_report_uploads', UPLOAD_STORE='images';
function openUploadDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(UPLOAD_DB_NAME,1);
    req.onupgradeneeded=()=>{req.result.createObjectStore(UPLOAD_STORE);};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function saveUploadedImage(key,dataUrl){
  try{
    const db=await openUploadDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(UPLOAD_STORE,'readwrite');
      tx.objectStore(UPLOAD_STORE).put(dataUrl,key);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }catch(e){console.warn('Não foi possível salvar a imagem localmente:',e);}
}
async function loadAllUploadedImages(){
  try{
    const db=await openUploadDB();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(UPLOAD_STORE,'readonly');
      const out={};
      const cur=tx.objectStore(UPLOAD_STORE).openCursor();
      cur.onsuccess=(e)=>{const c=e.target.result;if(c){out[c.key]=c.value;c.continue();}else resolve(out);};
      cur.onerror=()=>reject(cur.error);
    });
  }catch(e){console.warn('Não foi possível ler imagens salvas localmente:',e);return {};}
}
function uploadKey(period,bid,cat,idx){return `${period}::${bid}::${cat}::${idx}`;}
async function applyStoredUploads(){
  const all=await loadAllUploadedImages();
  for(const key in all){
    const [period,bid,cat,idxStr]=key.split('::');
    const idx=+idxStr;
    const bd=(DATASETS[period]||{})[bid];
    const arr=bd&&bd.posts&&bd.posts[cat];
    // fotos já curadas nos dados (DATASETS) têm prioridade sobre uploads antigos feitos
    // pelo modo de edição -- um upload salvo só preenche o slot se ele ainda estiver vazio
    if(arr&&arr[idx]&&!arr[idx].img) arr[idx].img=all[key];
  }
}
let __pendingUpload=null;
function triggerUpload(bid,cat,idx){__pendingUpload={bid,cat,idx};document.getElementById('upload-input').click();}
function onUploadInputChange(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value='';
  if(!file||!__pendingUpload) return;
  const {bid,cat,idx}=__pendingUpload;
  const reader=new FileReader();
  reader.onload=async()=>{
    const dataUrl=reader.result;
    DATASETS[activePeriod][bid].posts[cat][idx].img=dataUrl;
    await saveUploadedImage(uploadKey(activePeriod,bid,cat,idx),dataUrl);
    if(activeBrand===bid) renderBrand(BRANDS.find(b=>b.id===bid));
    flashSaved();
  };
  reader.readAsDataURL(file);
}

/* ============ EXPORTAR RELATÓRIO ATUALIZADO (fotos já embutidas) ============ */
function replaceConstBlock(src,varName,newValue){
  const marker=`const ${varName} = `;
  const start=src.indexOf(marker);
  if(start<0) return src;
  const braceStart=src.indexOf('{',start);
  let depth=0,i=braceStart,inStr=false,esc=false;
  for(;i<src.length;i++){
    const c=src[i];
    if(inStr){
      if(esc) esc=false;
      else if(c==='\\') esc=true;
      else if(c==='"') inStr=false;
    } else {
      if(c==='"') inStr=true;
      else if(c==='{') depth++;
      else if(c==='}'){depth--;if(depth===0){i++;break;}}
    }
  }
  const newJson=JSON.stringify(newValue,null,1);
  return src.slice(0,braceStart)+newJson+src.slice(i);
}
function buildFabMenu(){
  const menu=document.getElementById('fab-menu');
  let html='<button onclick="toggleFab(false);setTimeout(()=>window.print(),120)"><span class="ic">🖨️</span> Baixar relatório em PDF</button>';
  html+=`<button onclick="toggleInternalAccess();toggleFab(false)"><span class="ic">${unlocked?'🔓':'🔒'}</span> ${unlocked?'Bloquear edição':'Acesso interno (editar)'}</button>`;
  if(unlocked){
    html+='<button onclick="downloadUpdatedReport();toggleFab(false)"><span class="ic">🖼️</span> Baixar relatório atualizado (com fotos)</button>';
  }
  menu.innerHTML=html;
}
function buildExportedHtml(){
  let script=__ORIG_SCRIPT__;
  script=replaceConstBlock(script,'DATASETS',DATASETS);
  return __HEAD_PREFIX__+script+__TAIL_SUFFIX__;
  /* note: "unlocked" is always declared as "let unlocked=false;" in the source,
     so every exported/downloaded copy always opens LOCKED by default -- nobody
     inherits an unlocked session just by receiving the file.
     Serializing the whole DATASETS object (instead of 7 fixed brand consts) means
     this keeps working correctly no matter how many periods get added later. */
}
function downloadUpdatedReport(){
  const full=buildExportedHtml();
  const blob=new Blob([full],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='relatorio-web-atualizado.html';
  document.body.appendChild(a);a.click();a.remove();
  flashSaved();

  { id:'2026-02-w1-semanal', tipo:'Semanal', mes:'Fevereiro', label:'1ª Semana de Fevereiro', range:'30/01 – 05/02/2026' },
  { id:'2026-02-w2-semanal', tipo:'Semanal', mes:'Fevereiro', label:'2ª Semana de Fevereiro', range:'06/02 – 12/02/2026' },
  { id:'2026-02-w3-semanal', tipo:'Semanal', mes:'Fevereiro', label:'3ª Semana de Fevereiro', range:'13/02 – 19/02/2026' },
  { id:'2026-02-w4-semanal', tipo:'Semanal', mes:'Fevereiro', label:'4ª Semana de Fevereiro', range:'20/02 – 26/02/2026' },
  { id:'2026-02-mensal', tipo:'Mensal', label:'Fevereiro 2026', range:'01/02 – 28/02/2026' },

];
/* período padrão ao abrir: sempre o mais recente (último da lista) —
   novos períodos devem sempre ser adicionados ao final, em ordem cronológica */
let activePeriod = PERIODS[PERIODS.length-1].id;
let activeBrand  = 'overview';
function brandData(bid){ return (DATASETS[activePeriod]||{})[bid] || null; }
function curPeriod(){ return PERIODS.find(p=>p.id===activePeriod) || PERIODS[0]; }
/* aviso por período: PERIODS[i].notice (texto livre) vira uma caixa de alerta no topo da Visão Geral e de cada marca */
function periodNotice(cp,isOv){
  if(!cp||!cp.notice) return '';
  const extra=isOv&&cp.noBenchmark?'<br><b>Nós vs. concorrente:</b> não foi possível definir se tivemos maior ou menor engajamento que os concorrentes, devido à limitação da ferramenta.':'';
  return `<div class="disclaimer"><span class="i">⚠️</span><span>${cp.notice}${extra}</span></div>`;
}
/* símbolo de atenção (!) que mostra o mesmo aviso do período ao passar o mouse -- vai ao lado de cada
   título/indicador cujo dado ficou comprometido pela limitação da ferramenta */
function warnIcon(cp){ return cp&&cp.notice?`<span class="warn-i" tabindex="0" aria-label="Atenção: dados comprometidos">⚠️<span class="warn-pop">${cp.notice}</span></span>`:''; }
const WARN_BRAND_SECTIONS=['Visão geral · Big Numbers','Sentimento das menções','Classificação das menções','Share de menções · Concorrência','Share de Menções · Evolutivo diário','Gêneros de menções · Tagueamento','Target mensal'];
function markCompromised(){
  const cp=curPeriod(); if(!cp||!cp.notice) return;
  document.querySelectorAll('#content .sec-head h2').forEach(h=>{
    if(activeBrand==='overview'||WARN_BRAND_SECTIONS.includes(h.textContent.trim())) h.insertAdjacentHTML('beforeend',warnIcon(cp));
  });
  document.querySelectorAll('#content .kpi .label').forEach(l=>{
    if(/^(Menções externas|Saudabilidade externa)/.test(l.textContent.trim())) l.insertAdjacentHTML('beforeend',warnIcon(cp));
  });
}

function noteKey(pid,bid,field){return 'cliente_report::'+pid+'::'+bid+'::'+field;}
const NOTE_FIELDS=['resumoExec','overviewPos','overviewNeu','overviewNeg','insightTitle','insightText'];
function applyStoredNotes(N,pid,bid){
  /* runs on every render (locked or unlocked) so saved text survives reload
     the same way uploaded photos do -- editing UI is what's gated, not the data */
  NOTE_FIELDS.forEach(f=>{
    let saved=null;try{saved=localStorage.getItem(noteKey(pid,bid,f));}catch(e){}
    if(saved!==null) N[f]=saved;
  });
  return N;
}
let toastT;

  const pid=curPeriod().id;
  document.querySelectorAll('.editable[data-field]').forEach(el=>{
    const k=noteKey(pid,bid,el.dataset.field);
    el.addEventListener('input',()=>{
      const v=el.textContent.trim();el.classList.toggle('empty',v==='');
      try{if(v==='')localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}

/* ==== SVG pie/donut ==== */
function polar(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
function arc(cx,cy,r,r0,a0,a1){
  const[x0,y0]=polar(cx,cy,r,a1),[x1,y1]=polar(cx,cy,r,a0);
  const[x2,y2]=polar(cx,cy,r0,a0),[x3,y3]=polar(cx,cy,r0,a1);
  const large=a1-a0>180?1:0;
  return `M${x0} ${y0}A${r} ${r} 0 ${large} 0 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${large} 1 ${x3} ${y3}Z`;
}
function pieSVG(items,{size=190,inner=0.58,title='',fmt=nf}={}){
  const cx=size/2,cy=size/2,r=size/2-4,r0=r*inner;
  const tot=items.reduce((s,i)=>s+i.v,0)||1;let a=0;let paths='';
  items.forEach((it,idx)=>{
    const sweep=it.v/tot*360;const a1=a+sweep;
    if(it.v>0){
      const pct=(it.v/tot*100);
      paths+=`<path class="hoverable" d="${arc(cx,cy,r,r0,a+0.6,a1-0.6)}" fill="${it.c}"
        data-l="${esc(it.l)}" data-c="${esc(it.c)}" data-v="${it.v}" data-pct="${pct.toFixed(1)}" data-title="${esc(title)}"
        onmousemove="ttSlice(event)" onmouseleave="hideTT()"></path>`;
    }
    a=a1;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="max-width:100%">${paths}</svg>`;
}
function ttSlice(e){const t=e.currentTarget.dataset;
  showTT(`<div class="tt-t">${t.title||t.l}</div><div class="tt-r"><span class="d" style="background:${t.c}"></span><span class="l">${t.l}</span><span class="v">${nf(+t.v)}<span class="vp"> · ${t.pct}%</span></span></div>`,e.clientX,e.clientY);
}

/* horizontal bars */
function hbars(items,{max=null,color='var(--gold)',fmt=nf,pctOf=null}={}){
  const mx=max||Math.max(...items.map(i=>i.v),1);
  return `<div class="hbars">`+items.map(i=>{
    const pct=pctOf?` <span class="pct" style="color:var(--muted)">${(i.v/pctOf*100).toFixed(1)}%</span>`:'';
    const tip=i.tip?` data-tip="${esc(i.tip)}" onmouseenter="tipEnter(event)" onmousemove="tipMove(event)" onmouseleave="hideTT()" style="cursor:help"`:'';
    return `<div class="hbar"${tip}><div class="row"><span class="nm">${esc(i.label)}</span><span class="vl"><b>${fmt(i.v)}</b>${pct}</span></div>
      <div class="track"><div class="fill" style="width:${Math.max(i.v/mx*100,2)}%;background:${color}"></div></div></div>`;
  }).join('')+`</div>`;
}

/* line chart 2 series with crosshair */
function lineChart(series,labels,{w=680,h=280,names=[],colors=[]}={}){
  const pad={l:38,r:16,t:16,b:34};const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const allv=series.flat();const mx=Math.max(...allv,1);const step=iw/(labels.length-1);
  const yy=v=>pad.t+ih-(v/mx)*ih;const xx=i=>pad.l+i*step;
  let grid='';const ticks=4;
  for(let t=0;t<=ticks;t++){const val=mx*t/ticks;const y=yy(val);
    grid+=`<line x1="${pad.l}" y1="${y}" x2="${w-pad.r}" y2="${y}" stroke="#eceae3"/><text x="${pad.l-8}" y="${y+4}" text-anchor="end" font-size="10" fill="#a9a49a">${Math.round(val)}</text>`;}
  let paths='';
  series.forEach((s,si)=>{
    const d=s.map((v,i)=>`${i?'L':'M'}${xx(i).toFixed(1)} ${yy(v).toFixed(1)}`).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${colors[si]}" stroke-width="2.4" stroke-linejoin="round"/>`;
  });
  // x labels (sparse)
  let xlab='';labels.forEach((l,i)=>{if(i%Math.ceil(labels.length/10)===0){xlab+=`<text x="${xx(i)}" y="${h-12}" text-anchor="middle" font-size="9.5" fill="#a9a49a">${l}</text>`;}});
  // hover overlay
  const pts=labels.map((_,i)=>xx(i));
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="overflow:visible" id="lc"
      onmousemove="lcMove(event,this)" onmouseleave="lcLeave(this)"
      data-pts='${attrJSON(pts)}' data-series='${attrJSON(series)}' data-labels='${attrJSON(labels)}' data-names='${attrJSON(names)}' data-colors='${attrJSON(colors)}'>
    ${grid}${paths}${xlab}
    <line class="cross" x1="0" y1="${pad.t}" x2="0" y2="${pad.t+ih}" stroke="#c9c4b8" stroke-dasharray="3 3" style="opacity:0"/>
    <g class="dots"></g>
  </svg>`;
}
function lcMove(e,svg){
  const pts=JSON.parse(svg.dataset.pts),series=JSON.parse(svg.dataset.series),labels=JSON.parse(svg.dataset.labels),names=JSON.parse(svg.dataset.names),colors=JSON.parse(svg.dataset.colors);
  const rect=svg.getBoundingClientRect();const vb=svg.viewBox.baseVal;const sx=vb.width/rect.width;
  const mxv=(e.clientX-rect.left)*sx;
  let idx=0,best=1e9;pts.forEach((p,i)=>{const d=Math.abs(p-mxv);if(d<best){best=d;idx=i;}});
  const cross=svg.querySelector('.cross');cross.setAttribute('x1',pts[idx]);cross.setAttribute('x2',pts[idx]);cross.style.opacity='1';
  const pad={l:38,r:16,t:16,b:34};const ih=vb.height-pad.t-pad.b;const mx=Math.max(...series.flat(),1);const yy=v=>pad.t+ih-(v/mx)*ih;
  const dots=svg.querySelector('.dots');dots.innerHTML=series.map((s,si)=>`<circle cx="${pts[idx]}" cy="${yy(s[idx])}" r="4.5" fill="${colors[si]}" stroke="#fff" stroke-width="2"/>`).join('');
  showTT(`<div class="tt-t">${labels[idx]}</div>`+series.map((s,si)=>`<div class="tt-r"><span class="d" style="background:${colors[si]}"></span><span class="l">${names[si]}</span><span class="v">${nf(s[idx])}</span></div>`).join(''),e.clientX,e.clientY);
}
function lcLeave(svg){svg.querySelector('.cross').style.opacity='0';svg.querySelector('.dots').innerHTML='';hideTT();}

function netBadge(net){
  const map={instagram:'Instagram',youtube:'YouTube',x:'X / Twitter',twitter:'X / Twitter',fbpage:'Facebook',facebook:'Facebook'};
  return map[net]||(net?net[0].toUpperCase()+net.slice(1):'Post');

function postCard(p,i,bid,cat){
  const net=(p.net||'').toLowerCase();
  const label=netBadge(net);
  const canUpload=bid&&cat&&unlocked;
  const canLink=!canUpload&&!!p.url;
  const uploadAttr=canUpload?` onclick="triggerUpload('${bid}','${cat}',${i})" title="Clique para adicionar/trocar o print" style="cursor:pointer"`:'';
  const thumb=p.img
    ? `<img src="${p.img}" alt="">${canUpload?`<div class="thumb-edit">✎ Trocar foto</div>`:''}${canLink?`<div class="thumb-edit">↗ Ver publicação</div>`:''}`
    : `<span class="ph-ico">📤</span><div>${canUpload?'Clique para<br>adicionar print':'Adicionar print<br>do post'}</div>`;
  const stats=[];
  if(p.likes!=null&&p.likes>0)stats.push(`<span><b>${nf(p.likes)}</b> curtidas</span>`);
  if(p.comments!=null&&p.comments>0)stats.push(`<span><b>${nf(p.comments)}</b> coment.</span>`);
  if(p.shares!=null&&p.shares>0)stats.push(`<span><b>${nf(p.shares)}</b> compart.</span>`);
  if(p.reach!=null&&p.reach>0)stats.push(`<span><b>${nf(p.reach)}</b> alcance</span>`);
  const cap=p.caption?`<div class="cap">${esc(p.caption)}</div>`:'';
  const showAuthor=p.author&&p.author!=='plataforma de monitoramentoSystem';
  const author=showAuthor
    ? (p.authorUrl
        ? `<a class="author" href="${esc(p.authorUrl)}" target="_blank" rel="noopener">${esc(p.author)}</a>`
        : `<div class="author">${esc(p.author)}</div>`)
    : '';
  const thumbTag=canLink?'a':'div';
  const thumbHref=canLink?` href="${esc(p.url)}" target="_blank" rel="noopener"`:'';
  return `<div class="post">
    <${thumbTag} class="thumb"${uploadAttr}${thumbHref}><span class="netbadge">${label}</span>${thumb}</${thumbTag}>
    <div class="body">
      <div class="eng">${nf(p.eng)} <span>engajamentos</span></div>
      ${author}

      ${cap}

}
function postGrid(posts,emptyMsg,bid,cat){

    const siblings=PERIODS.filter(p=>p.tipo==='Semanal'&&p.mes===cp.mes);
    return siblings.map(p=>{
      const bd=(DATASETS[p.id]||{})[bid];
      return {label:p.label.replace(' de '+p.mes,''), v:bd?bd.mentions.total:0, tip:p.range};

  return d.target.weekly.map((w,i)=>({label:'Semana '+(i+1),v:w.v,tip:shortRange(w.range)}));

/* ============ OVERVIEW (todas as marcas) ============ */
function computeOverview(){
  const cp=curPeriod();
  const rows=BRANDS.map(b=>{
    const d=(DATASETS[cp.id]||{})[b.id];
    if(!d) return null;
    const own=(d.shareOfVoice||[]).find(x=>x.own);
    return {
      b,
      mentions:d.mentions.total,
      health:d.health.total,
      ownMentions:own?own.v:d.mentions.ext,
      compMentions:d.competitor.mentions,
      compName:b.competitor,
      targetPct:d.target.goal?(d.target.reached/d.target.goal*100):null,
    };
  }).filter(Boolean);
  return {cp,rows};
}
/* cartão premium com sombra em camadas (sem borda fina) — base reutilizada pelas grades da Visão Geral */
const OV_SHADOW='0 2px 6px rgba(20,18,14,.07),0 14px 30px rgba(20,18,14,.09)';
/* cor de destaque de cada marca (mesma cor usada em body[data-brand=...] --gold),
   pra colorir o número de cada card de acordo com a marca dele */
const BRAND_COLOR={m1:'#a9791f',m2:'#d81f34',m3:'#0f6b4c',m4:'#8c1f24',m5:'#ad9223',m6:'#1a8296',m7:'#b5651d'};
/* ranking com pin dourado/prata/bronze nas 3 primeiras posições, reaproveitado
   pelo card "Nós vs. concorrente" (maior vantagem) e por outros trechos do arquivo */
const MEDAL=['#d4af37','#b8b8b8','#c98a4b'];
/* destaques/pontos de atenção calculados automaticamente a partir dos dados do período --
   mesma lógica usada no protótipo em avaliação (visão-geral.md), adaptada ao nosso modelo de dados */
function ovInsights(rows,cp){
  const pw=cp.tipo==='Mensal'?'do mês':'da semana';
  const tag=r=>`<b style="color:${BRAND_COLOR[r.b.id]||'var(--ink)'}">${esc(r.b.name)}</b>`;
  const byMentions=rows.slice().sort((a,b)=>b.mentions-a.mentions);
  const leader=byMentions[0];
  const wins=rows.filter(r=>r.ownMentions>=r.compMentions);
  const losses=rows.filter(r=>r.ownMentions<r.compMentions);
  const maiorMargem=wins.slice().sort((a,b)=>(b.ownMentions/Math.max(b.compMentions,1))-(a.ownMentions/Math.max(a.compMentions,1)))[0];
  const bySaude=rows.slice().sort((a,b)=>b.health-a.health);
  const maisSaudavel=bySaude[0],menosSaudavel=bySaude[bySaude.length-1];
  const byMeta=rows.filter(r=>r.targetPct!=null).sort((a,b)=>b.targetPct-a.targetPct);
  const maisProximaMeta=byMeta[0];

  const destaques=[
    `${tag(leader)} lidera o volume de menções ${pw}, com <b>${nf(leader.mentions)}</b> registros — a marca mais comentada do portfólio.`,
    cp.noBenchmark?'':`Placar geral de <b style="color:var(--pos)">${wins.length} vitória${wins.length===1?'':'s'}</b> e <b style="color:var(--neg)">${losses.length} derrota${losses.length===1?'':'s'}</b> frente aos concorrentes diretos em menções de mar aberto.`,
    (maiorMargem&&!cp.noBenchmark)?`${tag(maiorMargem)} tem a maior vantagem competitiva ${pw}: <b>${nf(maiorMargem.ownMentions)}</b> menções contra <b>${nf(maiorMargem.compMentions)}</b> de ${esc(maiorMargem.compName)}.`:'',
    `${tag(maisSaudavel)} é a marca mais saudável do período, com <b>${pf(maisSaudavel.health)}%</b> de menções positivas e neutras.`,
  ].filter(Boolean);

  const atencao=[
    cp.noBenchmark?'Não foi possível comparar o desempenho das marcas com os concorrentes diretos nesta semana, devido à limitação da ferramenta.':losses.length?`${losses.map(tag).join(' e ')} ${losses.length===1?'segue':'seguem'} em desvantagem frente ao seu concorrente direto ${pw}.`:`Nenhuma marca está em desvantagem frente ao concorrente direto — placar 100% favorável.`,
    `${tag(menosSaudavel)} é a marca com menor índice de saudabilidade (<b>${pf(menosSaudavel.health)}%</b>) — vale acompanhar o tom das menções negativas.`,
    maisProximaMeta?`${tag(maisProximaMeta)} é a marca mais próxima de atingir a meta ${cp.tipo==='Mensal'?'mensal':'do período'} de menções (<b>${pf(maisProximaMeta.targetPct)}%</b> já atingido).`:'',
    byMeta.length>1?`As demais marcas seguem em ritmo mais lento de acumulação frente à meta — oportunidade de reforçar ações de amplificação nas próximas semanas.`:'',
  ].filter(Boolean);

  return `<div class="ov-insight-grid">
    <div class="ov-insight-card">
      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M15 2A6 6 0 0 0 9 8c0 2.5 1.5 3.7 2.3 4.7.5.6.7 1.2.7 2.3h4c0-1.1.2-1.7.7-2.3.8-1 2.3-2.2 2.3-4.7a6 6 0 0 0-4-6z"/></svg> Destaques do Período</h3>
      <ul>${destaques.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
    <div class="ov-insight-card attn">
      <h3><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg> Pontos de Atenção</h3>
      <ul>${atencao.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>
  </div>`;
}
/* gráfico de barras verticais (uma por marca, cor da própria marca, logo embaixo do eixo) */
function ovBarChart(items){
  const max=Math.max(...items.map(i=>i.v),1);
  return `<div class="card" style="box-shadow:${OV_SHADOW};border:none;padding:6px 6px 22px">
    <div class="ov-barchart">
      ${items.map(i=>{
        const h=Math.max(8,Math.round(i.v/max*230));
        const color=BRAND_COLOR[i.b.id]||'var(--gold)';
        return `<div class="ov-bar-col">
          <div class="ov-bar-val" style="color:${color}">${nf(i.v)}</div>
          <div class="ov-bar-rect" style="height:${h}px;background:${color}"></div>
          <img class="ov-bar-logo" src="${LOGOS[i.b.logo]}" alt="${esc(i.b.name)}">
        </div>`;
      }).join('')}
    </div>
  </div>`;
}
/* lista ranqueada com logo + barra de preenchimento + valor -- reaproveitada por
   Saudabilidade (barra verde fixa) e Meta mensal (barra na cor de cada marca) */
function ovRankList(items,colorFn){
  return `<div class="ov-rank-list">${items.map((i,idx)=>{
    if(i.v==null){
      return `<div class="ov-rank-row">
        <span class="ov-rank-num">${idx+1}</span>
        <img class="ov-rank-logo" src="${LOGOS[i.b.logo]}" alt="${esc(i.b.name)}">
        <div class="ov-rank-track" style="background:none"></div>
        <span class="ov-rank-val" style="color:var(--muted);font-weight:600;font-style:italic;font-size:11.5px;width:auto;white-space:nowrap">Sem meta definida</span>
      </div>`;
    }
    const color=colorFn(i);
    return `<div class="ov-rank-row">
      <span class="ov-rank-num">${idx+1}</span>
      <img class="ov-rank-logo" src="${LOGOS[i.b.logo]}" alt="${esc(i.b.name)}">
      <div class="ov-rank-track"><div class="ov-rank-fill" style="width:${Math.min(i.v,100)}%;background:${color}"></div></div>
      <span class="ov-rank-val" style="color:${color}">${pf(i.v)}%</span>
    </div>`;
  }).join('')}</div>`;
}
/* card "Nós vs. concorrente": duas barras empilhadas (Nós / concorrente) na mesma escala,
   com selo de vitória/derrota e um pin dourado/prata/bronze pra quem tem a maior vantagem --
   os próprios cards são ordenados da maior vantagem pra menor, então os pins 1/2/3 sempre
   aparecem em ordem visual da esquerda pra direita / de cima pra baixo */
function ovVsGrid(rows,cp){
  if(cp&&cp.noBenchmark){
    return `<div class="ov-grid">${rows.map(r=>`<div class="card ov-vs-card" style="box-shadow:${OV_SHADOW};border:none">
      <img class="ov-vs-logo" src="${LOGOS[r.b.logo]}" alt="${esc(r.b.name)}">
      <div class="ov-vs-nums"><span>Nós<b>${nf(r.ownMentions)}</b></span><span style="text-align:right">${esc(r.compName)}<b>—</b></span></div>
    </div>`).join('')}</div>`;
  }
  const ranked=rows.slice().sort((a,b)=>(b.ownMentions/Math.max(b.compMentions,1))-(a.ownMentions/Math.max(a.compMentions,1)));
  const top3=ranked.filter(r=>r.ownMentions>=r.compMentions).slice(0,3).map(r=>r.b.id);
  return `<div class="ov-grid">${ranked.map(r=>{
    const win=r.ownMentions>=r.compMentions;
    const max=Math.max(r.ownMentions,r.compMentions,1);
    const pctNos=Math.max(r.ownMentions/max*100,4);
    const pctEles=Math.max(r.compMentions/max*100,4);
    const pos=top3.indexOf(r.b.id);
    const medalHtml=pos>-1?`<span class="ov-vs-top" style="background:${MEDAL[pos]}">${pos+1}</span>`:'';
    return `<div class="card ov-vs-card" style="box-shadow:${OV_SHADOW};border:none">
      ${medalHtml}
      <span class="ov-vs-badge" style="background:${win?'var(--pos)':'var(--neg)'}">${win?'VITÓRIA':'DERROTA'}</span>
      <img class="ov-vs-logo" src="${LOGOS[r.b.logo]}" alt="${esc(r.b.name)}">
      <div class="ov-vs-nums">
        <span>Nós<b>${nf(r.ownMentions)}</b></span>
        <span style="text-align:right">${esc(r.compName)}<b>${nf(r.compMentions)}</b></span>
      </div>
      <div class="ov-vs-row"><span class="lbl">Nós</span><div class="ov-vs-track"><div class="ov-vs-fill" style="width:${pctNos}%;background:var(--gold)"></div></div></div>
      <div class="ov-vs-row"><span class="lbl">${esc(r.compName)}</span><div class="ov-vs-track"><div class="ov-vs-fill" style="width:${pctEles}%;background:var(--mc)"></div></div></div>
    </div>`;
  }).join('')}</div>`;
}
function renderOverview(){
  activeBrand='overview';
  document.body.dataset.brand='overview';
  const c=$('#content');
  // a Visão Geral não usa o menu lateral de seções (com a seção 3/4 lado a lado ele
  // sobrava e ficava estranho) -- conteúdo centralizado ocupando a largura toda
  document.getElementById('side').style.display='none';
  const drinkEl=document.getElementById('drink');drinkEl.classList.remove('has');
  const {cp,rows}=computeOverview();
  if(!rows.length){
    document.getElementById('side').style.display='none';
    c.innerHTML=`<div class="coming"><h3>Visão Geral</h3><p>Sem dados suficientes para o período selecionado (${cp.label}).</p></div>`;
    return;
  }
  const byMentions=rows.slice().sort((a,b)=>b.mentions-a.mentions).map(r=>({b:r.b,v:r.mentions}));
  const byHealth=rows.slice().sort((a,b)=>b.health-a.health).map(r=>({b:r.b,v:r.health}));
  const byTarget=rows.slice().sort((a,b)=>{
    if(a.targetPct==null&&b.targetPct==null) return 0;
    if(a.targetPct==null) return 1;
    if(b.targetPct==null) return -1;
    return b.targetPct-a.targetPct;
  }).map(r=>({b:r.b,v:r.targetPct}));
  const wins=rows.filter(r=>r.ownMentions>=r.compMentions).length;
  const losses=rows.length-wins;

  c.innerHTML=`
  <div class="brand-hero">
    <span class="period-corner">${cp.tipo} · Período: ${cp.range}</span>
    <h1 style="margin:6px 0 0;font-size:26px;color:var(--ink)">Visão Geral · Todas as marcas</h1>
  </div>
  ${periodNotice(cp,true)}

  ${ovInsights(rows,cp)}

  <section class="block" style="margin-top:20px">${sec(1,'Volume total de menções','ranking entre as marcas CLIENTE EXEMPLO')}
    ${ovBarChart(byMentions)}
  </section>

  <section class="block">${sec(2,'Nós vs. concorrente','cada marca comparada ao seu concorrente direto')}
    ${ovVsGrid(rows,cp)}
    ${cp.noBenchmark?`<div class="src" style="margin-top:12px">Não foi possível definir se tivemos maior ou menor engajamento que os concorrentes diretos nesta semana, devido à limitação da ferramenta.</div>`:`<div class="src" style="margin-top:12px">Placar geral: <b style="color:var(--pos)">${wins} vitória${wins===1?'':'s'}</b> · <b style="color:var(--neg)">${losses} derrota${losses===1?'':'s'}</b> (menções em mar aberto, marca vs. concorrente direto)</div>`}
  </section>

  <div class="ov-side-grid">
    <section class="block">${sec(3,'Saudabilidade por marca','% de menções positivas e neutras em relação ao total')}
      ${ovRankList(byHealth,()=>'var(--pos)')}
    </section>

    <section class="block">${sec(4,'Progresso da meta mensal','% da meta de menções totais já atingida')}
      ${ovRankList(byTarget,i=>BRAND_COLOR[i.b.id]||'var(--gold)')}
    </section>
  </div>

  <div class="footer">
    <div><img src="${LOGOS['agencia']}" alt="Agência Exemplo"><div class="src"><strong>Todos os dados deste relatório são fictícios</strong> (versão de demonstração)<br><span style="opacity:.9">Este relatório foi desenvolvido por Júlia Aleixo · <a href="https://www.linkedin.com/in/julia-aleixo/" style="color:inherit">LinkedIn</a></span></div></div>
    <div style="text-align:right"><img src="${LOGOS['cliente']}" alt="CLIENTE EXEMPLO"><div class="src">${cp.label}</div></div>
  </div>
  `;
  buildSidebar(['Volume de menções','Nós vs. concorrente','Saudabilidade','Meta mensal']);
  markCompromised();
}

/* ============ SIDEBAR (navegação por seções) ============ */
function sideLabels(){
  const base=['Resumo executivo','Visão geral','Sentimento','Classificação','Responding','Share de menções'];
  if(curPeriod().tipo!=='Semanal') base.push('Evolutivo');
  base.push('Gêneros de menções','Posts','Target mensal','Insights');
  return base;
}
let spyEls=[];
function buildSidebar(labelsOverride){
  const secs=[...document.querySelectorAll('#content section.block')];
  secs.forEach((el,i)=>{el.id='s-'+i;});
  const side=document.getElementById('side');
  const labs=labelsOverride||sideLabels();
  side.innerHTML='<div class="side-title">Seções</div>'+secs.map((el,i)=>{
    const lab=labs[i]||('Seção '+(i+1));
    const n=labelsOverride?(i+1):(i===0?'★':i);
    return `<a class="side-link" data-i="${i}" onclick="goSection(${i})"><span class="n">${n}</span>${lab}</a>`;
  }).join('');
  spyEls=secs;updateSpy();
}
function goSection(i){const el=document.getElementById('s-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function updateSpy(){
  if(!spyEls.length)return;let cur=0;
  spyEls.forEach((el,i)=>{if(el.getBoundingClientRect().top-140<=0)cur=i;});
  if((window.innerHeight+window.scrollY)>=document.documentElement.scrollHeight-2) cur=spyEls.length-1;
  document.querySelectorAll('.side-link').forEach(a=>a.classList.toggle('active',+a.dataset.i===cur));
}

/* ============ TABS ============ */
function buildTabs(){
  const bar=$('#tabbar');
  const overviewTab=`<button class="tab ${activeBrand==='overview'?'active':''}" data-id="overview"><span>Visão Geral</span></button>`;
  bar.innerHTML=overviewTab+BRANDS.map((b)=>`<button class="tab ${b.id===activeBrand?'active':''}" data-id="${b.id}">
    <img src="${LOGOS[b.logo]}" alt=""><span>${b.name}</span>${brandData(b.id)?'':'<span class="soon">em breve</span>'}</button>`).join('');
  bar.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
    bar.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    if(t.dataset.id==='overview') renderOverview();
    else renderBrand(BRANDS.find(b=>b.id===t.dataset.id));
    window.scrollTo({top:0,behavior:'smooth'});
  }));
}

/* ============ SELETOR DE PERÍODO ============ */
function pmItem(p){
  // no grupo Mensal (Julho, Agosto...) o rotulo ja diz tudo -- a faixa de datas embaixo
  // so ocupa espaco a toa; mantemos a faixa so nos itens Semanais, onde ela e informativa.
  const rangeHtml=p.tipo==='Mensal'?'':`<span class="pm-range">${p.range}</span>`;
  return `<button class="pm-item ${p.id===activePeriod?'active':''}" onclick="setPeriod('${p.id}')">${p.label}${rangeHtml}</button>`;
}
function pmToggleSubgroup(btn){
  btn.classList.toggle('open');
  const list=btn.nextElementSibling;
  if(list) list.classList.toggle('open');
}
function buildPeriodMenu(){
  const menu=$('#period-menu');const groups={};
  PERIODS.forEach(p=>{(groups[p.tipo]=groups[p.tipo]||[]).push(p);});
  let html='';
  Object.keys(groups).forEach(tipo=>{
    html+=`<div class="pm-group">${tipo}</div>`;
    if(tipo==='Semanal'){
      // agrupa as semanas por mês num submenu que abre/fecha -- assim, quando setembro
      // (ou uma 4ª semana de agosto) entrar, a lista continua organizada por mês
      const byMonth={};
      groups[tipo].forEach(p=>{const k=p.mes||'';(byMonth[k]=byMonth[k]||[]).push(p);});
      Object.keys(byMonth).forEach(mes=>{
        if(!mes){ byMonth[mes].forEach(p=>{html+=pmItem(p);}); return; }
        // sempre começa fechado -- o usuário escolhe qual mês abrir, em vez de um mês
        // (o do período ativo) vir sempre expandido e os outros escondidos
        html+=`<button class="pm-subgroup" onclick="pmToggleSubgroup(this)">${mes}<span class="pm-sub-caret">▾</span></button>`;
        html+=`<div class="pm-sublist">${byMonth[mes].map(pmItem).join('')}</div>`;
      });
    } else {
      groups[tipo].forEach(p=>{html+=pmItem(p);});
    }
  });
  menu.innerHTML=html;
  $('#pl-tipo').textContent=curPeriod().tipo;
  $('#pl-label').textContent=curPeriod().label;
}
function togglePeriod(){$('#period-menu').classList.toggle('open');hidePeriodHint();}
function setPeriod(id){
  activePeriod=id;$('#period-menu').classList.remove('open');
  buildPeriodMenu();buildTabs();
  if(activeBrand==='overview') renderOverview();
  else renderBrand(BRANDS.find(b=>b.id===activeBrand)||BRANDS[0]);
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{const m=$('#period-menu');if(m&&!e.target.closest('.period-select'))m.classList.remove('open');});
let __phTimer;
function showPeriodHint(){
  const h=$('#period-hint');if(!h)return;
  h.classList.add('show');
  clearTimeout(__phTimer);
  __phTimer=setTimeout(hidePeriodHint,7000);
}
function hidePeriodHint(){const h=$('#period-hint');if(h)h.classList.remove('show');}
document.addEventListener('click',e=>{if(!e.target.closest('.period-hint'))hidePeriodHint();});

/* init */
$('#logo-cliente').src=LOGOS['cliente'];
$('#logo-agencia').src=LOGOS['agencia'];
setTimeout(showPeriodHint,700);
(async()=>{
  await applyStoredUploads();
  buildFabMenu();
  buildPeriodMenu();
  buildTabs();
  renderOverview();
})();
addEventListener('scroll',()=>{if(tt.style.opacity==='1')hideTT();updateSpy();},{passive:true});
</script>
